services:
  web:
    build: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      REDIS_URL: ${REDIS_URL:-}
    # L'API n'est joignable que via nginx : on fait confiance à son X-Forwarded-For pour le rate limiting.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips", "*"]
    expose:
      - "8000"

  # Optionnel : `docker compose --profile redis up` et REDIS_URL=redis://redis:6379/0
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
